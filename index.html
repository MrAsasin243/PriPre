    +'</div><div class="wdp-toast"></div></div>';

  var area=mount.querySelector('.wdp-area'), wrap=mount.querySelector('.wdp-wrap'),
      stage=mount.querySelector('.wdp-stage'), prog=mount.querySelector('.wdp-prog'),
      notesEl=mount.querySelector('.wdp-notes'), count=mount.querySelector('.wdp-count'),
      bar=mount.querySelector('.wdp-bar'), hot=mount.querySelector('.wdp-hot'),
      hint=mount.querySelector('.wdp-hint'), toastEl=mount.querySelector('.wdp-toast'),
      autoBtn=mount.querySelector('[data-a="auto"]'), loopBtn=mount.querySelector('[data-a="loop"]'), modeBtn=mount.querySelector('[data-a="mode"]');
  var morph=document.createElement('div'); morph.className='wdp-morph'; stage.appendChild(morph);

 var idx=0,scale=1,busy=false,cur=null,dead=false,auto=null,gen=0;
  var anims=[],transAnims=[];
  var barVisible=false,inHot=false,overBar=false,focusBar=false,hideT=null,cursorT=null,toastT=null;

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function op(e){return e.op==null?1:e.op;}
  function rot(e){return 'rotate('+(e.rot||0)+'deg)';}
  function fin(e){return {opacity:op(e),transform:rot(e),filter:'none'};}
  function from(e){
    var t=rot(e),f='none';
    switch(e.enter){
      case 'fade':break;
      case 'fade-up':t+=' translateY(48px)';break;
      case 'fade-down':t+=' translateY(-48px)';break;
      case 'fade-left':t+=' translateX(-56px)';break;
      case 'fade-right':t+=' translateX(56px)';break;
      case 'scale':t+=' scale(0.9)';break;
      case 'blur':f='blur(22px)';t+=' scale(1.04)';break;
      case 'flip':t+=' perspective(900px) rotateY(75deg)';break;
      default:return null;
    }
    return {opacity:0,transform:t,filter:f};
  }
  function srcdoc(e){
    return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
      +'<style>html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:transparent}'+(e.css||'')+'</style></head><body>'+(e.html||'')
      +'<script>try{'+(e.js||'')+'}catch(err){var p=document.createElement("pre");p.style.cssText="color:#b91c1c;font:12px monospace;padding:8px";p.textContent=String(err);document.body.appendChild(p)}<\/script></body></html>';
  }
  function textStyle(e){return 'font-size:'+(e.fs||32)+'px;font-weight:'+(e.fw||400)+';color:'+(e.color||'#111')+';text-align:'+(e.align||'left')+';padding:'+(e.pad||0)+'px';}
  function content(n,e){
    if(e.type==='text'){var t=document.createElement('div');t.className='wdp-txt';t.textContent=e.text||'';t.style.cssText=textStyle(e);n.appendChild(t);}
    else if(e.type==='img'){var im=document.createElement('img');im.src=e.src||'';im.style.objectFit=e.fit||'cover';im.draggable=false;n.appendChild(im);}
    else if(e.type==='code'){var f=document.createElement('iframe');f.setAttribute('sandbox','allow-scripts allow-popups allow-forms');f.srcdoc=srcdoc(e);n.appendChild(f);}
  }

  /* Слайд создаётся сразу в стартовых состояниях анимаций — финал не «моргает» */
  function build(sl,initial){
    var L=document.createElement('div'); L.className='wdp-layer'; L.style.background=sl.bg||'#fff';
    (sl.elements||[]).forEach(function(e,i){
      var n=document.createElement('div'); n.className='wdp-el'; n.dataset.id=e.id;
      n.style.left=e.x+'px'; n.style.top=e.y+'px'; n.style.width=e.w+'px'; n.style.height=e.h+'px'; n.style.zIndex=i+1;
      n.style.borderRadius=(e.rad||0)+'px';
      n.style.background=e.type==='rect'?(e.bg||'#ccc'):(e.type==='text'?(e.bg||'transparent'):'transparent');
      var F=fin(e); n.style.opacity=F.opacity; n.style.transform=F.transform;
      content(n,e);
      if(e.morphId)n.dataset.morph=e.morphId;
      if(initial&&e.enter&&e.enter!=='none'){var S=from(e);if(S){n.style.opacity=S.opacity;n.style.transform=S.transform;n.style.filter=S.filter;n.dataset.pending='1';}}
      L.appendChild(n);
    });
    return L;
  }
  function node(L,id){return L.querySelector('[data-id="'+id+'"]');}
  function enter(L,sl,base){
    var k=0;
    (sl.elements||[]).forEach(function(e){
      var n=node(L,e.id); if(!n||n.dataset.pending!=='1')return;
      delete n.dataset.pending;
      var a=n.animate([from(e),fin(e)],{duration:e.enterDur||750,delay:(base||0)+(e.enterDelay||0)+k*90,easing:EASE,fill:'both'});
      k++; anims.push(a);
      a.onfinish=function(){var F=fin(e);n.style.opacity=F.opacity;n.style.transform=F.transform;n.style.filter='none';a.cancel();};
    });
  }

  /* Morph в координатах слайда — фон не «вырастает из угла» */
  function clone(oldE,newE,dur){
    var c=document.createElement('div'); c.className='wdp-el wdp-clone';
    c.style.left=oldE.x+'px'; c.style.top=oldE.y+'px'; c.style.width=oldE.w+'px'; c.style.height=oldE.h+'px';
    c.style.borderRadius=(oldE.rad||0)+'px'; c.style.transformOrigin='top left'; c.style.opacity=op(oldE);
    c.style.background=oldE.type==='rect'?(oldE.bg||'#ccc'):(oldE.type==='text'?(oldE.bg||'transparent'):'transparent');
    if(oldE.type==='text'){
      var a=document.createElement('div'); a.className='wdp-txt'; a.textContent=oldE.text||'';
      a.style.cssText='position:absolute;inset:0;'+textStyle(oldE); c.appendChild(a);
      transAnims.push(a.animate([{fontSize:(oldE.fs||32)+'px'},{fontSize:(newE.fs||32)+'px'}],{duration:dur,easing:EASE,fill:'forwards'}));
      if((oldE.text||'')!==(newE.text||'')){
        transAnims.push(a.animate([{opacity:1},{opacity:0}],{duration:dur*.55,delay:dur*.3,easing:'ease',fill:'forwards'}));
        var b=document.createElement('div'); b.className='wdp-txt'; b.textContent=newE.text||'';
        b.style.cssText='position:absolute;inset:0;opacity:0;'+textStyle(newE); c.appendChild(b);
        transAnims.push(b.animate([{opacity:0},{opacity:1}],{duration:dur*.55,delay:dur*.4,easing:'ease',fill:'forwards'}));
      }
    } else if(oldE.type==='img'){
      var im=document.createElement('img'); im.src=oldE.src||''; im.style.objectFit=oldE.fit||'cover'; c.appendChild(im);
    }
    morph.appendChild(c);
    transAnims.push(c.animate([
      {left:oldE.x+'px',top:oldE.y+'px',width:oldE.w+'px',height:oldE.h+'px',borderRadius:(oldE.rad||0)+'px',opacity:op(oldE)},
      {left:newE.x+'px',top:newE.y+'px',width:newE.w+'px',height:newE.h+'px',borderRadius:(newE.rad||0)+'px',opacity:op(newE)}
    ],{duration:dur,easing:EASE,fill:'forwards'}));
  }

  function ui(){
    count.textContent=(idx+1)+' / '+deck.slides.length;
    prog.style.width=((idx+1)/deck.slides.length*100)+'%';
    notesEl.textContent=deck.slides[idx].notes||'Заметок нет';
  }
  function show(i,withEnter){
    gen++;                                                    // прерываем любой активный переход
    busy=false;
    transAnims.forEach(function(a){try{a.cancel();}catch(e){}});
    transAnims=[];
    stage.querySelectorAll('.wdp-layer').forEach(function(l){l.remove();});  // убираем ВСЕ слои
    morph.innerHTML='';
    idx=clamp(i,0,deck.slides.length-1);
    cur=build(deck.slides[idx],withEnter);
    stage.insertBefore(cur,morph);
    ui();
    if(withEnter)enter(cur,deck.slides[idx],140);
  }
  function go(i){
    var n=deck.slides.length;
    if(cfg.loop){ if(i>=n)i=0; else if(i<0)i=n-1; }
    i=clamp(i,0,n-1);
    if(busy||dead||i===idx)return;
    var myGen=++gen;                                        // поколение этого перехода
    var fromI=idx, oldSl=deck.slides[fromI], toSl=deck.slides[i];
    var tr=toSl.transition||'morph';
    var dur=toSl.transitionDur!=null?toSl.transitionDur:(TRANS[tr]||800);
    var old=cur, L=build(toSl,true);
    stage.insertBefore(L,morph); idx=i; ui();
    if(tr==='cut'||dur<=0){old.remove();cur=L;enter(L,toSl,0);return;}
    busy=true; L.style.opacity='0';
    var jobs=[];
    function anim(el,kf,o){var a=el.animate(kf,o);transAnims.push(a);jobs.push(a.finished.catch(function(){}));return a;}
    if(tr==='morph'){
      var oldMap={};
      oldSl.elements.forEach(function(e){if(e.morphId&&e.type!=='code')oldMap[e.morphId]=e;});
      toSl.elements.forEach(function(e){
        if(e.morphId&&oldMap[e.morphId]&&e.type!=='code'){
          var n=node(L,e.id);
          if(n){delete n.dataset.pending;n.dataset.hold='1';var F=fin(e);n.style.opacity='0';n.style.transform=F.transform;n.style.filter='none';}
          clone(oldMap[e.morphId],e,dur);
        }
      });
      anim(old,[{opacity:1},{opacity:0}],{duration:dur*.8,easing:EASE,fill:'forwards'});
      anim(L,[{opacity:0},{opacity:1}],{duration:dur*.85,easing:EASE,fill:'forwards'});
      enter(L,toSl,dur*.55);
    } else {
      var dir=i>fromI?1:-1, ok, nk;
      if(tr==='zoom'){ok=[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(1.12)'}];nk=[{opacity:0,transform:'scale(.88)'},{opacity:1,transform:'scale(1)'}];}
      else if(tr==='blur'){ok=[{opacity:1,filter:'blur(0px)'},{opacity:0,filter:'blur(26px)'}];nk=[{opacity:0,filter:'blur(26px)'},{opacity:1,filter:'blur(0px)'}];}
      else if(tr==='slide'){ok=[{transform:'translateX(0)'},{transform:'translateX('+(-dir*100)+'%)'}];nk=[{transform:'translateX('+(dir*100)+'%)'},{transform:'translateX(0)'}];L.style.opacity='1';}
      else if(tr==='parallax'){ok=[{opacity:1,transform:'translateX(0) scale(1)'},{opacity:0,transform:'translateX('+(-dir*28)+'%) scale(.94)'}];nk=[{opacity:0,transform:'translateX('+(dir*36)+'%) scale(1.04)'},{opacity:1,transform:'translateX(0) scale(1)'}];}
      else{ok=[{opacity:1},{opacity:0}];nk=[{opacity:0},{opacity:1}];}
      anim(old,ok,{duration:dur,easing:EASE,fill:'forwards'});
      anim(L,nk,{duration:dur,easing:EASE,fill:'forwards'});
      enter(L,toSl,dur*.5);
    }
    var done=false;
    function finish(){
      if(done||dead)return;
      if(myGen!==gen)return;                                  // переход прерван новым show()/go()
      done=true;
      transAnims.forEach(function(a){try{a.cancel();}catch(e){}}); transAnims=[];
      old.remove(); morph.innerHTML='';
      L.querySelectorAll('[data-hold]').forEach(function(n){
        var e=toSl.elements.find(function(x){return x.id===n.dataset.id;});
        if(e){var F=fin(e);n.style.opacity=F.opacity;n.style.transform=F.transform;n.style.filter='none';}
        delete n.dataset.hold;
      });
      L.style.opacity='1'; L.style.transform='none'; L.style.filter='none';
      cur=L; busy=false;
    }
    Promise.all(jobs).then(finish);
    setTimeout(finish,dur+140);
  }

  /* ---------- Панель управления: показ по зоне, скрытие по таймеру ---------- */
  function toast(msg,ms){
    toastEl.textContent=msg; toastEl.classList.add('on');
    clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove('on');},ms||2200);
  }
  function schedule(){
    clearTimeout(hideT);
    if(cfg.controls==='always'||inHot||overBar||focusBar)return;
    hideT=setTimeout(function(){barOff();},cfg.hideDelay);
  }
  function barOn(){
    if(cfg.controls==='hidden')return;
    barVisible=true; bar.classList.add('on'); hint.classList.remove('on');
    area.classList.remove('wdp-nocursor'); clearTimeout(cursorT);
    schedule();
  }
  function barOff(force){
    if(!force&&(cfg.controls==='always'||inHot||overBar||focusBar))return;
    clearTimeout(hideT);
    barVisible=false; bar.classList.remove('on');
    hint.classList.toggle('on',!!cfg.hint&&cfg.controls!=='always');
    if(cfg.hideCursor)area.classList.add('wdp-nocursor');
  }
  function modeLabel(){return cfg.controls==='auto'?'Авто':cfg.controls==='always'?'Всегда':'Скрыто';}
  function setMode(m,quiet){
    cfg.controls=m; if(opts.onCfg)opts.onCfg('controls',m);
    applyCfg();
    if(!quiet)toast('Панель: '+(m==='auto'?'автоскрытие':m==='always'?'всегда видна':'скрыта · H — вернуть'));
  }
  function setLoop(on,quiet){
    cfg.loop=!!on;
    if(opts.onCfg)opts.onCfg('loop',cfg.loop);
    loopBtn.classList.toggle('on',cfg.loop);
    if(!quiet)toast('По кругу: '+(cfg.loop?'включён':'выключен'));
  }
  function applyCfg(){
    mount.classList.toggle('wdp-top',cfg.pos==='top');
    hot.style.height=cfg.hotZone+'px';
    prog.style.display=cfg.progress?'block':'none';
    count.style.display=cfg.counter?'inline-block':'none';
    modeBtn.textContent=modeLabel();
    modeBtn.classList.toggle('on',cfg.controls!=='auto');
    modeBtn.title='Режим панели (H): '+modeLabel();
    loopBtn.classList.toggle('on',!!cfg.loop);
    clearTimeout(hideT); clearTimeout(cursorT);
    area.classList.remove('wdp-nocursor');
    if(cfg.controls==='always'){barVisible=true;bar.classList.add('on');hint.classList.remove('on');}
    else if(cfg.controls==='hidden'){barOff(true);}
    else{barOn();}
  }
  function move(ev){
    if(dead||ev.pointerType==='touch')return;
    var r=area.getBoundingClientRect(), y=ev.clientY-r.top;
    var hotNow=cfg.pos==='top'? y<=cfg.hotZone : y>=r.height-cfg.hotZone;
    var overWidget=!!(ev.target&&ev.target.closest&&ev.target.closest('iframe'));
    if(!overWidget){
      area.classList.remove('wdp-nocursor');
      clearTimeout(cursorT);
      if(cfg.hideCursor)cursorT=setTimeout(function(){if(!barVisible&&!inHot&&!overBar)area.classList.add('wdp-nocursor');},cfg.hideDelay);
    }
    if(hotNow!==inHot){inHot=hotNow; if(inHot)barOn(); else schedule();}
  }
  function leaveArea(){inHot=false;overBar=false;schedule();}
  var sx=null,sy=null,st=0,stype='';
  function pd(ev){
    if(ev.target.closest('.wdp-bar')||ev.target.closest('.wdp-hint')||ev.target.closest('iframe'))return;
    sx=ev.clientX;sy=ev.clientY;st=Date.now();stype=ev.pointerType;
  }
  function pu(ev){
    if(sx==null)return;
    var dx=ev.clientX-sx,dy=ev.clientY-sy,dt=Date.now()-st; sx=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){go(idx+(dx<0?1:-1));return;}
    if(stype==='touch'&&Math.abs(dx)<12&&Math.abs(dy)<12&&dt<450){
      if(barVisible)barOff(true);
      else if(cfg.controls==='hidden')setMode('auto',true);
      else barOn();
    }
  }
  function pc(){sx=null;}
  function fit(){
    var r=area.getBoundingClientRect();
    scale=Math.min(r.width/W,r.height/H)||1;
    wrap.style.width=W*scale+'px'; wrap.style.height=H*scale+'px';
    stage.style.transform='scale('+scale+')';
  }
  function full(){
    if(document.fullscreenElement)document.exitFullscreen();
    else if(mount.requestFullscreen)mount.requestFullscreen();
  }
  function setAuto(on){
    if(auto){clearInterval(auto);auto=null;}
    if(on)auto=setInterval(function(){
      if(busy)return;
      if(idx<deck.slides.length-1||cfg.loop)go(idx+1); else setAuto(false);
    },4200);
    autoBtn.classList.toggle('on',!!auto);
  }
  function key(ev){
    if(dead)return;
    var k=ev.key;
    if(k==='ArrowRight'||k==='PageDown'||k===' '){ev.preventDefault();go(idx+1);}
    else if(k==='ArrowLeft'||k==='PageUp'){ev.preventDefault();go(idx-1);}
    else if(k==='Home'){go(0);barOn();}
    else if(k==='End'){go(deck.slides.length-1);barOn();}
    else if(k==='h'||k==='H'||k==='р'||k==='Р'){setMode(cfg.controls==='auto'?'always':cfg.controls==='always'?'hidden':'auto');}
    else if(k==='n'||k==='N'||k==='т'||k==='Т'){notesEl.classList.toggle('on');barOn();}
    else if(k==='a'||k==='A'||k==='ф'||k==='Ф'){setAuto(!auto);barOn();toast(auto?'Автопоказ включён':'Автопоказ выключен');}
    else if(k==='l'||k==='L'||k==='д'||k==='Д'){setLoop(!cfg.loop);barOn();}
    else if(k==='f'||k==='F'||k==='а'||k==='А'){full();barOn();}
    else if(k==='Escape'){if(document.fullscreenElement)document.exitFullscreen();else if(opts.onExit)opts.onExit();}
  }
  var wt=0;
  function wh(ev){if(Math.abs(ev.deltaY)<24)return;var t=Date.now();if(t-wt<650)return;wt=t;go(idx+(ev.deltaY>0?1:-1));}
  function rs(){fit();}

  document.addEventListener('keydown',key);
  addEventListener('resize',rs);
  document.addEventListener('fullscreenchange',rs);
  area.addEventListener('pointermove',move);
  area.addEventListener('pointerleave',leaveArea);
  area.addEventListener('pointerdown',pd);
  area.addEventListener('pointerup',pu);
  area.addEventListener('pointercancel',pc);
  area.addEventListener('wheel',wh,{passive:true});
  bar.addEventListener('pointerenter',function(){overBar=true;clearTimeout(hideT);});
  bar.addEventListener('pointerleave',function(){overBar=false;schedule();});
  bar.addEventListener('focusin',function(){focusBar=true;clearTimeout(hideT);});
  bar.addEventListener('focusout',function(){focusBar=false;schedule();});
  hint.addEventListener('click',function(){if(cfg.controls==='hidden')setMode('auto',true);barOn();});
  bar.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-a]'); if(!b)return;
    var a=b.dataset.a;
    if(a==='prev')go(idx-1); else if(a==='next')go(idx+1);
    else if(a==='notes')notesEl.classList.toggle('on');
    else if(a==='full')full();
    else if(a==='auto'){setAuto(!auto);toast(auto?'Автопоказ включён':'Автопоказ выключен');}
    else if(a==='loop'){setLoop(!cfg.loop);}
    else if(a==='mode')setMode(cfg.controls==='auto'?'always':cfg.controls==='always'?'hidden':'auto');
    else if(a==='exit'&&opts.onExit)opts.onExit();
    if(a!=='mode')schedule();
  });

  fit(); show(opts.start||0,true); applyCfg();
  toast(cfg.controls==='hidden'?'Панель скрыта · H — вернуть':'Кромка '+(cfg.pos==='top'?'сверху':'снизу')+' — панель · H — режим · тап на телефоне',3400);

  return {
    next:function(){go(idx+1);}, prev:function(){go(idx-1);}, goTo:go,
    replay:function(){show(idx,true);},
    preview:function(t){t=clamp(t,0,deck.slides.length-1);if(t>0){show(t-1,false);setTimeout(function(){go(t);},420);}else show(t,true);},
    settings:function(next){for(var k in next){if(k in DEF)cfg[k]=next[k];}applyCfg();},
    auto:function(on){setAuto(!!on);},
    loop:function(on){setLoop(!!on,true);},
    fit:fit, index:function(){return idx;},
    destroy:function(){
      dead=true; setAuto(false);
      clearTimeout(hideT);clearTimeout(cursorT);clearTimeout(toastT);
      anims.concat(transAnims).forEach(function(a){try{a.cancel();}catch(e){}});
      document.removeEventListener('keydown',key);
      removeEventListener('resize',rs);
      document.removeEventListener('fullscreenchange',rs);
      area.removeEventListener('pointermove',move);
      area.removeEventListener('pointerleave',leaveArea);
      area.removeEventListener('pointerdown',pd);
      area.removeEventListener('pointerup',pu);
      area.removeEventListener('pointercancel',pc);
      area.removeEventListener('wheel',wh);
      mount.innerHTML=''; mount.classList.remove('wdp','wdp-top');
    }
  };
};
Player(DECK,document.getElementById("deck"),{standalone:true});
</script>
